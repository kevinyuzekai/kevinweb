<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KevinWeb · 下载与分享</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f6f7f9;
      color: #1a1a1a;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* 头部 */
    .site-header {
      margin-bottom: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .site-title {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #111;
      text-decoration: none;
      display: inline-block;
      width: fit-content;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s ease;
    }

    .site-title:hover {
      border-bottom-color: #d0d0d0;
    }

    .site-description {
      font-size: 1rem;
      color: #6b6b6b;
      max-width: 90%;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 1.75rem;
      margin: 1rem 0 0.25rem;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .nav a {
      color: #3d3d3d;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .nav a:hover {
      color: #000;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-thickness: 1.5px;
    }

    /* 搜索栏 */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      margin: 2rem 0 2rem;
      padding: 1rem 1.25rem;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
      border: 1px solid #ececec;
    }

    .search-wrapper {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      min-width: 200px;
    }

    .search-wrapper svg {
      width: 1.1rem;
      height: 1.1rem;
      stroke: #9a9a9a;
      stroke-width: 2;
      fill: none;
      transition: stroke 0.2s ease;
    }

    .search-wrapper input {
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      background: transparent;
      width: 100%;
      color: #1a1a1a;
      padding: 0.4rem 0;
    }

    .search-wrapper input::placeholder {
      color: #b0b0b0;
      font-weight: 400;
    }

    .search-wrapper:focus-within svg {
      stroke: #1a1a1a;
    }

    /* 资源列表 */
    .resource-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* 空状态 */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5rem 1.5rem;
      background-color: #ffffff;
      border-radius: 24px;
      border: 1px dashed #e0e0e0;
      color: #7a7a7a;
    }

    .empty-state-icon {
      font-size: 2.2rem;
      margin-bottom: 0.75rem;
      opacity: 0.35;
    }

    .empty-state-text {
      font-size: 1rem;
      font-weight: 500;
      color: #5a5a5a;
    }

    .empty-state-sub {
      font-size: 0.85rem;
      margin-top: 0.3rem;
      color: #a0a0a0;
    }

    /* 底部分页 */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 2.5rem;
    }

    .pagination a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 2rem;
      height: 2rem;
      padding: 0 0.6rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #4a4a4a;
      background-color: #ffffff;
      border: 1px solid #ececec;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .pagination a:hover {
      background-color: #f0f0f0;
      border-color: #dcdcdc;
    }

    .pagination a.active {
      background-color: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    /* 底部 */
    .site-footer {
      margin-top: 4rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e0e0e0;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      font-size: 0.85rem;
      color: #6f6f6f;
    }

    .footer-links {
      display: flex;
      gap: 1.5rem;
    }

    .footer-links a {
      color: #5a5a5a;
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-links a:hover {
      color: #000;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* 响应式 */
    @media (max-width: 640px) {
      body {
        padding: 1.5rem 1rem;
      }

      .toolbar {
        padding: 1rem;
      }

      .site-footer {
        flex-direction: column;
        align-items: flex-start;
      }

      .empty-state {
        padding: 3.5rem 1rem;
      }
    }

    /* 暗色模式 */
    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0f0f0f;
        color: #e0e0e0;
      }

      .site-title {
        color: #f0f0f0;
      }

      .site-title:hover {
        border-bottom-color: #4a4a4a;
      }

      .site-description {
        color: #a0a0a0;
      }

      .nav a {
        color: #b0b0b0;
      }

      .nav a:hover {
        color: #fff;
      }

      .toolbar {
        background-color: #1a1a1a;
        border-color: #2e2e2e;
      }

      .search-wrapper svg {
        stroke: #7a7a7a;
      }

      .search-wrapper input {
        color: #e0e0e0;
      }

      .search-wrapper input::placeholder {
        color: #6a6a6a;
      }

      .search-wrapper:focus-within svg {
        stroke: #d0d0d0;
      }

      .empty-state {
        background-color: #1a1a1a;
        border-color: #2e2e2e;
        color: #8a8a8a;
      }

      .empty-state-text {
        color: #a0a0a0;
      }

      .empty-state-sub {
        color: #6a6a6a;
      }

      .pagination a {
        background-color: #1a1a1a;
        border-color: #2e2e2e;
        color: #b0b0b0;
      }

      .pagination a:hover {
        background-color: #2a2a2a;
      }

      .pagination a.active {
        background-color: #f0f0f0;
        color: #1a1a1a;
        border-color: #f0f0f0;
      }

      .site-footer {
        border-top-color: #2a2a2a;
        color: #8a8a8a;
      }

      .footer-links a {
        color: #9a9a9a;
      }

      .footer-links a:hover {
        color: #fff;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <header class="site-header">
      <a href="#" class="site-title">KevinWeb</a>
      <p class="site-description">收集、整理、分享值得下载的好东西。所有资源均来自互联网，仅供学习交流。</p>
      <nav class="nav">
        <a href="#">首页</a>
        <a href="#">全部资源</a>
        <a href="https://kevinyuzekai.github.io/kevinweb/About_me.html">关于</a>
        <a href="#">提交资源</a>
      </nav>
    </header>

    <!-- 搜索栏 -->
    <div class="toolbar">
      <div class="search-wrapper">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" placeholder="搜索资源名称或描述...">
      </div>
    </div>

    <!-- 资源列表（空） -->
    <main class="resource-list">
      <div class="empty-state">
        <div class="empty-state-icon">◌</div>
        <div class="empty-state-text">这里还没有资源</div>
        <div class="empty-state-sub">很快就会有新的内容出现</div>
      </div>
    </main>

    <!-- 分页 -->
    <div class="pagination">
      <a href="#" class="active">1</a>
      <a href="#">2</a>
      <a href="#">3</a>
      <a href="#">4</a>
      <a href="#">→</a>
    </div>

    <!-- 底部 -->
    <footer class="site-footer">
      <div class="footer-copy">
        © 2025 KevinWeb · 仅供学习交流
      </div>
      <div class="footer-links">
        <a href="#">RSS</a>
        <a href="#">GitHub</a>
        <a href="#">免责声明</a>
        <a href="#">联系</a>
      </div>
    </footer>
  </div>
</body>
</html>
